[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-access-cost-experiment"
version = "0.1.0"
description = "A repeatable harness for comparing AI access patterns and their costs."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
integrations = [
	"databricks-sql-connector>=4.0",
	"databricks-sdk>=0.50",
	"requests>=2.32",
]

[project.scripts]
access-cost = "ai_access_cost_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]